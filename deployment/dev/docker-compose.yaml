services:
  api:
    container_name: "odds-worklog-api"
    image: "ghcr.io/oddsteam/api.odds-worklog:dev-odds-cloud"
    command: /app/api
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - "mongodb"
    networks:
      - odds_worklog_api
    restart: always

  mongodb:
    container_name: "odds-worklog-mongo"
    image: "mongo:6.0.27"
    volumes:
      - mongodbdata_odds_worklog:/data/db
    env_file:
      - .env
    ports:
      - "27017:27017"
    networks:
      - odds_worklog_api
  web:
    container_name: "odds-worklog-web"
    image: "ghcr.io/oddsteam/web.odds-worklog:dev-odds-cloud"
    ports:
      - "80:80"
    networks:
      - odds_worklog_api
    restart: always

volumes:
  mongodbdata_odds_worklog:

networks:
  odds_worklog_api:
