on:
  push:
    branches: ["develop"]

name: CI/CD Project worklogAPI Develop (ODDS Cloud)

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_TAG: dev-odds-cloud

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version-file: go.mod

      - name: Run tests
        run: make test


  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, tag, and push image to GHCR
        id: build-image
        run: |
          IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

  deploy:
    name: Deploy
    needs: build
    runs-on: self-hosted
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull docker image
        id: pull-image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Checkout for get docker compose file
        uses: actions/checkout@v4

      - name: copy docker compose file via ssh password
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ vars.ODDS_CLOUD_DEV_HOST }}
          username: ubuntu
          key: ${{ secrets.ODDS_CLOUD_DEV_PRIVATE_KEY}}
          source: "deployment/dev/docker-compose.yaml"
          target: "/home/ubuntu/worklog"
          strip_components: 2

      - name: SSH Shell Command
        uses: fifsky/ssh-action@master
        with:
          command: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd /home/ubuntu/worklog
            docker compose pull
            docker compose down
            docker compose up -d
          host: ${{ vars.ODDS_CLOUD_DEV_HOST }}
          user: ubuntu
          key: ${{ secrets.ODDS_CLOUD_DEV_PRIVATE_KEY}}
