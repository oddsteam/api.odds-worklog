on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version to build and deploy (e.g. v1.2.3). Leave empty to use the triggering ref.'
        required: false
        type: string

name: CI/CD Project worklogAPI Production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Resolve version
      id: version
      run: |
        if [ -n "${{ inputs.version }}" ]; then
          VERSION="${{ inputs.version }}"
        elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
          VERSION="${{ github.ref_name }}"
        else
          echo "No version provided. Use a v*.*.* tag or pass workflow_dispatch input."
          exit 1
        fi
        echo "value=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: ${{ steps.version.outputs.value }}

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build, tag, and push image to GHCR
      id: build-image
      run: |
        VERSION=${{ steps.version.outputs.value }}
        IMAGE_BASE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        docker build -t "$IMAGE_BASE:$VERSION" -t "$IMAGE_BASE:prod" .
        docker push "$IMAGE_BASE:$VERSION"
        docker push "$IMAGE_BASE:prod"

    - name: SSH Shell Command
      uses: fifsky/ssh-action@master
      with:
        command: |
          cd ~/app/
          ./deploy_prod.sh ${{ steps.version.outputs.value }}
        host: ${{ secrets.HOST }}
        user: root
        key: ${{ secrets.PRIVATE_KEY}}
